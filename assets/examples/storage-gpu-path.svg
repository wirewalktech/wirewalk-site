<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc"><title id="title">Follow the batch to useful GPU work</title><desc id="desc">An illustrative data path separates discovery, reading, CPU processing and GPU consumption, with checkpoint traffic considered separately.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#79b6a3"/></marker></defs><rect width="1100" height="470" rx="16" fill="#141c23"/><text x="32" y="38" font-family="sans-serif" font-size="20" fill="#e7efef">Follow the batch to useful GPU work</text><path d="M230 195 L300 195" stroke="#79b6a3" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="273.0" y="187.0" font-family="sans-serif" font-size="14" fill="#c6d4db"></text><path d="M510 195 L585 195" stroke="#79b6a3" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="555.5" y="187.0" font-family="sans-serif" font-size="14" fill="#c6d4db"></text><path d="M785 195 L850 195" stroke="#79b6a3" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="825.5" y="187.0" font-family="sans-serif" font-size="14" fill="#c6d4db"></text><path d="M950 245 L765 350" stroke="#d9a478" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="865.5" y="289.5" font-family="sans-serif" font-size="14" fill="#c6d4db"></text><rect x="30" y="140" width="200" height="105" rx="9" fill="#23313d" stroke="#627c8d"/><text x="46" y="169" font-family="sans-serif" font-size="17" fill="#e7efef">Shared dataset</text><text x="46" y="193" font-family="sans-serif" font-size="14" fill="#b8cad4">Identity and file layout</text><text x="46" y="217" font-family="sans-serif" font-size="14" fill="#b8cad4">Metadata + read paths</text><rect x="300" y="140" width="210" height="105" rx="9" fill="#23313d" stroke="#627c8d"/><text x="316" y="169" font-family="sans-serif" font-size="17"