title: Wirewalk Advisory
tagline: HPC and AI infrastructure
description: >-
  HPC and AI infrastructure engineering and architecture. Cluster design and
  build-out, InfiniBand fabric, parallel storage, GPU and AI stacks, schedulers,
  and the enterprise IT around them.
author: Wirewalk Advisory

# Change both of these together if the repository is renamed.
url: https://www.wirewalk.com
# Served at the root of www.wirewalk.com (see CNAME). GitHub 301-redirects
# the old wirewalktech.github.io/wirewalk-site/ URL here, so baseurl must be
# empty -- a non-empty baseurl makes every internal link 404 on the live domain.
baseurl: ""

permalink: /writing/:title/
timezone: America/New_York

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: post }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

# Generates /sitemap.xml at build time. On the GitHub Pages allowlist,
# so no Gemfile change and no build mode change is needed.
plugins:
  - jekyll-sitemap
