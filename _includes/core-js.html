<script>
(function(){
  const header=document.getElementById('hd');
  const burger=document.getElementById('burger');
  const menu=document.getElementById('lk');
  function setMenu(open){
    if(!burger||!menu)return;
    menu.classList.toggle('open',open);
    burger.classList.toggle('on',open);
    burger.setAttribute('aria-expanded',String(open));
    burger.setAttribute('aria-label',open?'Close navigation':'Open navigation');
    if(open)requestAnimationFrame(()=>menu.querySelector('a').focus({preventScroll:true}));
  }
  if(burger&&menu){
    burger.addEventListener('click',()=>setMenu(burger.getAttribute('aria-expanded')!=='true'));
    header.addEventListener('focusout',event=>{if(event.relatedTarget&&!header.contains(event.relatedTarget))setMenu(false)});
    menu.addEventListener('click',event=>{if(event.target.closest('a'))setMenu(false)});
    document.addEventListener('click',event=>{if(!header.contains(event.target))setMenu(false)});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&burger.getAttribute('aria-expanded')==='true'){setMenu(false);burger.focus()}});
    addEventListener('resize',()=>{if(innerWidth>1040)setMenu(false)},{passive:true});
  }
  function headerState(){if(header)header.classList.toggle('stuck',scrollY>4)}
  addEventListener('scroll',headerState,{passive:true});headerState();
  // Native scrolling and keyboard behavior are left to the browser.
  function revealFragment(){
    let id;try{id=decodeURIComponent(location.hash.slice(1))}catch{return}
    const target=document.getElementById(id);
    const group=target&&target.closest('details');
    if(group)group.open=true;
  }
  revealFragment();addEventListener('hashchange',revealFragment);
  // The contact form retains its normal FormSubmit POST and return URL.
  const frm=document.querySelector('.frm');
  if(frm){frm.addEventListener('submit',()=>{
    const btn=frm.querySelector('.btn');
    if(btn){btn.textContent='Sending';btn.disabled=true;}
    frm.classList.add('sending');
  });}
})();
</script>
