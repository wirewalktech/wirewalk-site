<script>
/* ── header: sliding pill + scrollspy ─────────────────────────────────
   One shared background glides between nav items on hover and settles
   back onto whichever section is actually in view. */
(function(){
  const lk=$('#lk'), pill=$('#pill'), items=$$('#lk a,#lk button');
  if(!lk||!pill)return;
  let current=null;
  function place(el,show){
    if(!el){pill.classList.remove('show');return;}
    pill.style.width=el.offsetWidth+'px';
    pill.style.height=el.offsetHeight+'px';
    pill.style.transform='translateX('+el.offsetLeft+'px)';
    if(show)pill.classList.add('show');
  }
  const settle=()=>{ current?place(current,true):pill.classList.remove('show'); };
  items.forEach(el=>{
    el.addEventListener('pointerenter',()=>place(el,true));
    el.addEventListener('focus',()=>place(el,true));
  });
  lk.addEventListener('pointerleave',settle);
  lk.addEventListener('focusout',e=>{ if(!lk.contains(e.relatedTarget))settle(); });
  addEventListener('resize',()=>{pill.style.transition='none';settle();
    requestAnimationFrame(()=>pill.style.transition='');},{passive:true});

  const IDS=['hpc','expertise','scale','audits','writing'], live=new Set();
  const spy=new IntersectionObserver(es=>{
    for(const e of es) e.isIntersecting?live.add(e.target.id):live.delete(e.target.id);
    const id=IDS.find(x=>live.has(x));
    const hit=id?items.find(i=>i.dataset.sec===id):null;
    if(hit===current)return;
    items.forEach(i=>i.classList.remove('cur'));
    current=hit||null; if(hit)hit.classList.add('cur');
    if(!lk.matches(':hover'))settle();
  },{rootMargin:'-64px 0px -55% 0px',threshold:0});
  IDS.forEach(id=>{const el=document.getElementById(id); if(el)spy.observe(el);});
})();
</script>
