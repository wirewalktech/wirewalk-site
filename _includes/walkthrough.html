{% assign clip = site.data.walkthroughs[include.key] %}
<div class="scenario-walkthrough" id="walkthrough-{{ include.key }}">
<video controls preload="none" poster="{{ '/assets/walkthroughs/' | append: include.key | append: '-poster.png' | relative_url }}" width="1280" height="800" style="display:block;max-width:100%;height:auto;border-radius:10px" aria-label="{{ clip.title | escape }} — narrated illustrative lab scenario">
<source src="{{ '/assets/walkthroughs/' | append: include.key | append: '.mp4' | relative_url }}" type="video/mp4">
<track kind="captions" srclang="en" label="English" src="{{ '/assets/walkthroughs/' | append: include.key | append: '.vtt' | relative_url }}" default>
Your browser can use the <a href="{{ '/assets/walkthroughs/' | append: include.key | append: '.mp4' | relative_url }}">MP4 download</a> instead.
</video>
<p class="small">Computer-generated narration of an illustrative scenario; not a recording of Lenny or a customer result. <a href="{{ '/assets/walkthroughs/' | append: include.key | append: '-transcript.txt' | relative_url }}">Read the transcript</a> · <a href="{{ '/assets/walkthroughs/' | append: include.key | append: '.mp4' | relative_url }}">Download MP4</a>.</p>
</div>

<script type="application/ld+json">{
"@context":"https://schema.org","@type":"VideoObject","@id":{{ '/assets/walkthroughs/' | append: include.key | append: '.mp4#video' | absolute_url | jsonify }},
"name":{{ clip.title | jsonify }},"description":{{ clip.description | jsonify }},
"thumbnailUrl":{{ '/assets/walkthroughs/' | append: include.key | append: '-poster.png' | absolute_url | jsonify }},
"contentUrl":{{ '/assets/walkthroughs/' | append: include.key | append: '.mp4' | absolute_url | jsonify }},
"uploadDate":{{ clip.upload_date | jsonify }},"duration":{{ clip.duration | jsonify }},"inLanguage":"en",
"creator":{"@type":"Organization","name":"Wirewalk"}
}</script>
