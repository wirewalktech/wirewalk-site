<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} &mdash; {{ site.title }}{% else %}{{ site.title }} &mdash; {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | truncate: 300 }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | truncate: 300 }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
{% include site-style.html %}
{% include prose.html %}
</head>
<body{% unless page.is_home %} class="no-pill"{% endunless %}>

{% include header.html %}

{{ content }}

{% include footer.html %}
{% include core-js.html %}
{% if page.is_home %}{% include home-js.html %}{% endif %}
</body></html>
